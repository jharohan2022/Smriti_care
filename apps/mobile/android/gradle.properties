# This machine has 7 GB RAM and runs the Android emulator alongside Gradle, so
# the JVM heap must stay well under total RAM. The old -Xmx8G/-Xmx4G-metaspace
# reserved ~12 GB and crashed the daemon ("Native memory allocation (mmap)
# failed ... G1 virtual space"). These caps leave headroom for the emulator + OS.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true

# Keep concurrency low so parallel workers don't multiply memory use on 7 GB.
org.gradle.workers.max=2
org.gradle.daemon=true

# Cap the Kotlin compile daemon too — it's a second JVM that otherwise balloons.
kotlin.daemon.jvmargs=-Xmx1g
