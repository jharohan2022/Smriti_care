name: smriticare_mobile
description: SmritiCare — offline-first dementia care app (Patient + ASHA flavors).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.0

  # Offline storage (Isar — fast local NoSQL)
  isar: ^3.1.0
  isar_flutter_libs: ^3.1.0
  path_provider: ^2.1.3

  # Networking
  dio: ^5.5.0
  connectivity_plus: ^6.0.3

  # Identity (device-bound, zero-auth)
  flutter_secure_storage: ^9.2.2
  uuid: ^4.4.0

  # Accessibility / narration
  flutter_tts: ^4.0.2          # on-device TTS fallback
  audioplayers: ^6.0.0         # play Bhashini-synthesised audio clips

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  isar_generator: ^3.1.0
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/targets/
    - assets/images/family/
    - assets/audio/            # pre-cached narration for zero-connectivity first-run

# Build flavors are configured in android/app/build.gradle and ios/ (Xcode schemes):
#   flutter run --flavor patient -t lib/main_patient.dart
#   flutter run --flavor asha    -t lib/main_asha.dart
